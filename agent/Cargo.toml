[package]
name = "quincho-agent"
version.workspace = true
edition.workspace = true
description = "Quincho agent: governed deploys on a Docker Swarm manager (unix socket API, PAM, git policy, tmpfs)"

[[bin]]
name = "quincho-agent"
path = "src/main.rs"

[dependencies]
quincho-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
zeroize = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "fs", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["json"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
hostname = "0.4"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
pam-client = "0.5"
